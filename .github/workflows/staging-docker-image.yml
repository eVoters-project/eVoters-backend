name: docker-ci-cd

on:
  push:
    branches:
      - 'dev'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Setup QEMU
        uses: docker/setup-qemu-action@v3.0.0

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3.3.0

      - name: Docker Login
        uses: docker/login-action@v3.1.0
        with:
            username: ${{ secrets.STAGING_DOCKERHUB_USERNAME }}
            password: ${{ secrets.STAGING_DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5.3.0
        with:
            context: .
            builder: ${{ steps.buildx.outputs.name }}
            push: true
            tags: ${{ secrets.STAGING_DOCKERHUB_USERNAME }}/evoters-backend:latest
            cache-from: type=registry,ref=${{ secrets.STAGING_DOCKERHUB_USERNAME }}/evoters-backend:buildcache
            cache-to: type=registry,ref=${{ secrets.STAGING_DOCKERHUB_USERNAME }}/evoters-backend:buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Evoters Backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          port: 22
          username: ${{ secrets.STAGING_SSH_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd deployment-scripts/e-voters/
            docker-compose pull evoters_backend
            docker-compose up evoters_backend -d
            docker-compose logs --tail 30 evoters_backend